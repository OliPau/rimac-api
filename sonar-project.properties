sonar.projectKey=OliPau_rimac-api
sonar.organization=olipau
sonar.host.url=https://sonarcloud.io
sonar.sources=src,infra,scripts,.github
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json
# Coverage policy applies to the executable backend; tooling is still analyzed.
sonar.coverage.exclusions=infra/**,scripts/**,.github/**
sonar.qualitygate.timeout=300
