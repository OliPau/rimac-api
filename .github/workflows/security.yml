name: Dependency security
on:
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/security.yml
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/security.yml
  schedule:
    - cron: '23 13 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global --ignore-scripts snyk@1.1307.4
      - name: Reject high and critical dependency vulnerabilities
        id: scan
        run: snyk test --all-projects --detection-depth=1 --dev --org=olipau --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Monitor the main dependency graph
        if: always() && github.ref == 'refs/heads/main' && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure')
        run: >-
          snyk monitor --all-projects --detection-depth=1 --dev --org=olipau
          --target-reference=main
          --remote-repo-url=https://github.com/OliPau/rimac-api
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
