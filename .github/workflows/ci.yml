name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker compose up -d --wait
      - run: pnpm check
      - run: pnpm format
      - run: pnpm coverage
      - run: pnpm integration
      - run: pnpm openapi
      - run: pnpm bundle
      - run: python scripts/package-local.py
      - run: python scripts/inspect-package.py .local/artifacts
      - if: always()
        run: docker compose down
